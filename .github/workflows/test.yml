name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        version: [latest, 0.24.0, v0.23.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: emela
        uses: ./
        with:
          version: ${{ matrix.version }}
      - name: Run the installed emela
        run: |
          emela --version
          reported="$(emela --version)"
          test "${reported%%+*}" = "emela ${{ steps.emela.outputs.version }}"
      - name: Check a pinned version
        if: matrix.version != 'latest'
        run: |
          version='${{ matrix.version }}'
          test "${{ steps.emela.outputs.version }}" = "${version#v}"

  # Windows builds are released from 0.28.0 on.
  windows:
    strategy:
      fail-fast: false
      matrix:
        version: [latest, 0.28.0]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - id: emela
        uses: ./
        with:
          version: ${{ matrix.version }}
      - name: Run the installed emela
        run: |
          emela --version
          reported="$(emela --version | tr -d '\r')"
          test "${reported%%+*}" = "emela ${{ steps.emela.outputs.version }}"
      - name: Find emela from cmd
        shell: cmd
        run: emela --version

  windows-before-0-28:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - id: emela
        uses: ./
        continue-on-error: true
        with:
          version: 0.27.1
      - name: Expect the install to fail
        shell: bash
        run: test "${{ steps.emela.outcome }}" = failure

  unknown-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: emela
        uses: ./
        continue-on-error: true
        with:
          version: 0.0.0
      - name: Expect the install to fail
        run: test "${{ steps.emela.outcome }}" = failure

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: emela
        uses: ./
        with:
          version: 0.28.0
          playground: true
      - name: Check the playground files
        run: |
          dir='${{ steps.emela.outputs.playground }}'
          test -s "$dir/emela_playground.js"
          test -s "$dir/emela_playground_bg.wasm"

  # Releases before 0.28.0 (emela-lang/emela#615) have no playground compiler.
  no-playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: emela
        uses: ./
        continue-on-error: true
        with:
          version: 0.27.1
          playground: true
      - name: Expect the playground fetch to fail
        run: test "${{ steps.emela.outcome }}" = failure
